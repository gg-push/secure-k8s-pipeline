apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-podinfo-supply-chain
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 30
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - podinfo-prod
            - podinfo-dev
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: "*"
  attestors:
    - name: cosign
      cosign:
        ctlog:
          url: https://rekor.sigstore.dev
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/gg-push/secure-k8s-pipeline/.github/workflows/ci.yml@refs/heads/main
  attestations:
    - name: sbom
      intoto:
        type: https://spdx.dev/Document
  validations:
    - expression: >-
        images.containers.all(image,
          verifyImageSignatures(image, [attestors.cosign]) > 0 &&
          verifyAttestationSignatures(image, attestations.sbom, [attestors.cosign]) > 0
        )
      message: "Container image must have a valid Cosign keyless signature and signed SPDX SBOM attestation from gg-push/secure-k8s-pipeline main."
