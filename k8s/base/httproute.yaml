apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-route
spec:
  # Attach to this namespace's Envoy Gateway
  parentRefs:
    - name: main-gateway

  hostnames:
    - "podinfo.local"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: podinfo
          port: 80
          weight: 100
