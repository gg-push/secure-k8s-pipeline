apiVersion: v1
kind: Service
metadata:
  name: podinfo
  # --------------------------------------------------------------------------
  # ZERO-TRUST OBSERVABILITY (Tailscale Operator)
  # To expose this ClusterIP Service privately on your Tailnet:
  # 1. Install the Tailscale Kubernetes Operator with OAuth credentials.
  # 2. Uncomment the annotation below and commit to Git so ArgoCD reconciles it.
  # 3. Point monitoring/prometheus.yml at the resulting Tailscale MagicDNS host.
  # --------------------------------------------------------------------------
  # annotations:
  #   tailscale.com/expose: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: podinfo
