apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo-prod

resources:
  - ../../base
  - pdb.yaml

labels:
  - pairs:
      env: prod
    includeSelectors: false

images:
  - name: ghcr.io/gg-push/secure-k8s-pipeline
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
