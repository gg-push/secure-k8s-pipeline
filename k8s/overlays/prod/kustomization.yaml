apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo-prod

resources:
  - ../../base
  - pdb.yaml

labels:
  - pairs:
      env: prod
    includeSelectors: false

images:
  - name: ghcr.io/gg-push/secure-k8s-pipeline
    digest: sha256:f5ef13cf079c745dc27c8aba77b48a88bbb2e36bb8f5dc472af9de7f8bef3454

patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
