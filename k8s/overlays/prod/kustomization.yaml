apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit all core resources from the base directory
resources:
  - ../../base

# Add the prod environment label to everything
commonLabels:
  env: prod

# Define the image explicitly for prod
images:
  - name: ghcr.io/gg-push/secure-k8s-pipeline
    newTag: latest

# Patch the deployment to have 3 replicas in Prod
patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
