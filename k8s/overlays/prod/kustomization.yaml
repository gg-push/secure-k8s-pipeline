apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo-prod

resources:
  - ../../base
  - pdb.yaml

labels:
  - pairs:
      env: prod
    includeSelectors: false

images:
  - name: ghcr.io/gg-push/secure-k8s-pipeline
    digest: sha256:e943eb89303ef88e72e4bc5befce8530b824a911dd824e563c9b298c3a12dba8

patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
