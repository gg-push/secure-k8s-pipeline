apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo-dev

resources:
  - ../../base

labels:
  - pairs:
      env: dev
    includeSelectors: false

images:
  - name: ghcr.io/gg-push/secure-k8s-pipeline
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HTTPRoute
      name: podinfo-route
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: dev.podinfo.local
