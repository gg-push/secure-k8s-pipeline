apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Master list of all files to apply
resources:
  - deployment.yaml
  - service.yaml
  - tetragon-policy.yaml
#  - sealed-secret.yaml
#  - httproute.yaml

# 2. Inject these labels into EVERY file automatically
commonLabels:
  managed-by: argocd
  env: production

# 3. Dynamic tag override (CI pipeline can update this line without touching deployment.yaml)
images:
  - name: ghcr.io/gg-push/secure-k8s-pipeline
    newTag: latest

