name: Enterprise SecOps Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.26"

jobs:
  # Phase 1: Secret Scan, Go Vet, Tests & SAST
  sast-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for Gitleaks to scan history

      - name: Secret Scanning (Gitleaks)
        if: ${{ !env.ACT }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum

      - name: Run go vet (Native Linter)
        working-directory: ./app
        run: go vet ./...

      - name: Run Unit Tests (Race Detector)
        working-directory: ./app
        run: go test -race -v ./...

      - name: Run gosec (Go SAST)
        working-directory: ./app
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -severity=medium -exclude=G404,G505,G401,G705 ./cmd/podinfo/... ./pkg/...

  # Phase 1.5: IaC, Kustomize & Manifest Security Scan
  iac-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Validate Kustomize Overlays
        run: |
          kubectl kustomize k8s/overlays/dev > /dev/null
          kubectl kustomize k8s/overlays/prod > /dev/null

      - name: Run Checkov (IaC & K8s SAST)
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: .
          config_file: .checkov.yml
          soft_fail: false

  # Phase 2 & 3: Single-Build, Trivy SCA, Digest Push, SBOM & Cosign Attestation
  build-scan-publish:
    needs: [sast-and-test, iac-and-manifests]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Cosign keyless signing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Image Once for Scan & Publish
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy Scanner (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified Image & Capture Immutable Digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        run: |
          IMAGE_SHA="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_SHA")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.push.outputs.digest }}
          output-file: sbom.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: sbom.spdx.json

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign Immutable Image Digest (Zero Trust)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ steps.push.outputs.digest }}"

      - name: Attest SPDX SBOM to Image Digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ steps.push.outputs.digest }}"

  # Phase 4: Pin Signed Immutable Digest in GitOps Overlays
  update-gitops-digest:
    needs: [build-scan-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-scan-publish.outputs.image_digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Pin Signed Immutable Digest in Kustomize Overlays
        env:
          IMAGE_DIGEST: ${{ needs.build-scan-publish.outputs.image_digest }}
        run: |
          SHA_DIGEST="${IMAGE_DIGEST#*@}"
          sed -i -E "s|(digest: )sha256:[a-f0-9]+|\1${SHA_DIGEST}|" \
            k8s/overlays/dev/kustomization.yaml \
            k8s/overlays/prod/kustomization.yaml
          if git diff --quiet k8s/overlays/; then
            echo "Digest unchanged; skipping GitOps commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml k8s/overlays/prod/kustomization.yaml
          git commit -m "chore(gitops): pin podinfo digest to ${SHA_DIGEST:0:19} [skip ci]"
          git push origin HEAD:main
